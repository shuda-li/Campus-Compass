<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Compass · 校园活动策划</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // ═══ Star Rail 色彩体系 ═══
                        cosmos: '#0a0e1a',         // 深空底色
                        stellar: '#111833',        // 星体卡片
                        nebula: '#8b5cf6',         // 星云紫（主强调色）
                        nebulaDeep: '#7c3aed',     // 深星云紫
                        nebulaMuted: 'rgba(139,92,246,0.15)',  // 星云紫透明
                        amber: '#f0c060',          // 琥珀金（高亮/边框）
                        amberDeep: '#d4a030',      // 深琥珀
                        amberMuted: 'rgba(240,192,96,0.12)',   // 琥珀金透明
                        cyan: '#22d3bb',           // 青辉（信息/次级）
                        cyanMuted: 'rgba(34,211,187,0.12)',    // 青辉透明
                        starlight: '#e2e8f0',      // 星光白（主文字）
                        stardust: '#64748b',       // 星尘灰（辅助文字）
                        void: '#050812',           // 虚空黑（最深背景）
                        voidCard: 'rgba(17,24,51,0.85)',       // 半透明星体卡片
                        voidInput: 'rgba(17,24,51,0.6)',       // 半透明输入区
                        voidHover: 'rgba(30,40,70,0.7)',       // 悬浮态
                        voidBorder: 'rgba(139,92,246,0.2)',    // 边框星云紫
                        goldBorder: 'rgba(240,192,96,0.25)',   // 边框琥珀金
                        // 状态色
                        greenOk: '#4ade80',
                        redErr: '#f87171',
                        amberWarn: '#fbbf24',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
                        display: ['Cinzel', 'Georgia', 'PingFang SC', 'serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'typewriter': 'blink 0.8s step-end infinite',
                        'slide-in': 'slideIn 0.25s ease-out',
                        'slide-in-right': 'slideInRight 0.3s ease-out',
                        'slide-out-right': 'slideOutRight 0.3s ease-in',
                        'float': 'float 6s ease-in-out infinite',
                        'glow-pulse': 'glowPulse 3s ease-in-out infinite',
                        'shimmer': 'shimmer 2s ease-in-out infinite',
                    },
                    keyframes: {
                        blink: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0' },
                        },
                        slideIn: {
                            '0%': { opacity: '0', transform: 'translateX(-8px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        },
                        slideInRight: {
                            '0%': { opacity: '0', transform: 'translateX(-100%)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        },
                        slideOutRight: {
                            '0%': { opacity: '1', transform: 'translateX(0)' },
                            '100%': { opacity: '0', transform: 'translateX(-100%)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-6px)' },
                        },
                        glowPulse: {
                            '0%, 100%': { boxShadow: '0 0 5px rgba(139,92,246,0.3), 0 0 20px rgba(139,92,246,0.1)' },
                            '50%': { boxShadow: '0 0 10px rgba(139,92,246,0.5), 0 0 30px rgba(139,92,246,0.2)' },
                        },
                        shimmer: {
                            '0%, 100%': { backgroundPosition: '200% 0' },
                            '50%': { backgroundPosition: '-200% 0' },
                        }
                    }
                }
            }
        }
    </script>
    <!-- stylelint-disable at-rule-no-unknown -->
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto { content-visibility: auto; }
            /* ═══ Star Rail 按钮样式 ═══ */
            .btn-cosmos {
                @apply bg-nebulaMuted border border-voidBorder text-nebula text-sm px-3 py-1.5 rounded-lg transition-all hover:bg-nebula/20 hover:border-nebula/40 hover:shadow-[0_0_12px_rgba(139,92,246,0.25)];
            }
            .btn-cosmos-active {
                @apply bg-nebula/20 border border-nebula/40 text-nebula text-sm px-3 py-1.5 rounded-lg shadow-[0_0_8px_rgba(139,92,246,0.2)];
            }
            .btn-gold {
                @apply bg-amberMuted border border-goldBorder text-amber text-sm px-3 py-1.5 rounded-lg transition-all hover:bg-amber/15 hover:border-amber/40 hover:shadow-[0_0_15px_rgba(240,192,96,0.3)];
            }
            /* ═══ 玻璃面板 ═══ */
            .glass-panel {
                background: rgba(17, 24, 51, 0.75);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border: 1px solid rgba(139, 92, 246, 0.15);
            }
            .glass-panel-strong {
                background: rgba(17, 24, 51, 0.9);
                backdrop-filter: blur(24px);
                -webkit-backdrop-filter: blur(24px);
                border: 1px solid rgba(139, 92, 246, 0.25);
            }
            /* ═══ 渐变文字 ═══ */
            .text-gradient {
                background: linear-gradient(135deg, #f0c060 0%, #e2c87a 40%, #8b5cf6 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            .text-gradient-cyan {
                background: linear-gradient(135deg, #22d3bb 0%, #8b5cf6 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            /* ═══ 发光边框 ═══ */
            .border-glow {
                border: 1px solid rgba(139, 92, 246, 0.2);
                box-shadow: 0 0 8px rgba(139, 92, 246, 0.1), inset 0 0 8px rgba(139, 92, 246, 0.05);
            }
            .border-glow-gold {
                border: 1px solid rgba(240, 192, 96, 0.2);
                box-shadow: 0 0 10px rgba(240, 192, 96, 0.08), inset 0 0 6px rgba(240, 192, 96, 0.04);
            }
        }

        /* ═══════════════════════════════════════════════
           全局基础
           ═══════════════════════════════════════════════ */
        body { overflow: hidden; }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(240, 192, 96, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(34, 211, 187, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        #appContent {
            position: relative;
            z-index: 1;
        }

        /* ═══ 滚动条 ═══ */
        .chat-area::-webkit-scrollbar { width: 3px; }
        .chat-area::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.3); border-radius: 10px; }
        .chat-area::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.3); border-radius: 10px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }

        textarea { field-sizing: content; }
        .stream-text { white-space: pre-wrap; word-break: break-word; }
        .toggle-checkbox:checked { right: 0; }
        .toggle-checkbox:checked+.toggle-bg { background: linear-gradient(135deg, rgba(139,92,246,0.6), rgba(240,192,96,0.4)); }

        /* ═══ 星穹铁道特色的六边形装饰 ═══ */
        .hex-decoration {
            position: relative;
            width: 36px; height: 36px;
            background: rgba(139,92,246,0.1);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            border: 1px solid rgba(240,192,96,0.2);
            display: flex; align-items: center; justify-content: center;
        }

        /* ═══════════════════════════════════════════════
           白天模式（"曙光"主题）
           ═══════════════════════════════════════════════ */
        body.day-mode { background-color: #e8e0f0 !important; color: #1a1530 !important; }
        body.day-mode::after {
            background:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(240, 192, 96, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(34, 211, 187, 0.05) 0%, transparent 50%);
        }
        body.day-mode .glass-panel,
        body.day-mode .glass-panel-strong {
            background: rgba(255, 255, 255, 0.75);
            border-color: rgba(139, 92, 246, 0.15);
        }
        body.day-mode header { border-color: rgba(139,92,246,0.1) !important; background: rgba(255,255,255,0.6); backdrop-filter: blur(12px); }
        body.day-mode .text-starlight { color: #1a1530 !important; }
        body.day-mode .text-gray-200 { color: #1a1530 !important; }
        body.day-mode .text-gray-300 { color: #2a2040 !important; }
        body.day-mode .text-gray-400 { color: #4a3a60 !important; }
        body.day-mode .text-gray-500 { color: #6a5a80 !important; }
        body.day-mode .text-white { color: #1a1530 !important; }
        body.day-mode input, body.day-mode textarea { color: #1a1530 !important; }
        body.day-mode .placeholder-gray-500::placeholder { color: #8a7aa0 !important; }
        body.day-mode input::placeholder, body.day-mode textarea::placeholder { color: #8a7aa0 !important; }
        body.day-mode .chat-area::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.2); }
        body.day-mode .sidebar::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.2); }
        body.day-mode .sidebar { border-color: rgba(139,92,246,0.12) !important; }

        /* 白天半透明卡片 */
        body.day-mode [style*="background: rgba(17, 24, 51"],
        body.day-mode [style*="background:rgba(17,24,51"] {
            background: rgba(255,255,255,0.75) !important;
            border-color: rgba(139,92,246,0.15) !important;
        }
        body.day-mode .voidCard,
        body.day-mode [class*="voidCard"] {
            background: rgba(255,255,255,0.8) !important;
            border-color: rgba(139,92,246,0.12) !important;
        }

        /* ═══════════════════════════════════════════════
           自定义图片背景（75% 透明度）
           ═══════════════════════════════════════════════ */
        body.custom-bg { position: relative; }
        body.custom-bg::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.75;
            z-index: -1;
            pointer-events: none;
        }
        body.custom-bg .glass-panel,
        body.custom-bg .glass-panel-strong {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        body.custom-bg.day-mode .glass-panel,
        body.custom-bg.day-mode .glass-panel-strong {
            background: rgba(255,255,255,0.82) !important;
        }
    </style>
    <!-- stylelint-enable at-rule-no-unknown -->
</head>

<body id="appBody" class="bg-void text-starlight h-screen w-screen font-sans">

    <div id="appContent" class="flex h-full w-full">

        <!-- 侧边栏 -->
        <div id="sidebar"
            class="hidden fixed left-0 top-0 h-full w-72 z-40 flex flex-col animate-slide-in-right glass-panel-strong border-r border-voidBorder">
            <div class="p-4 border-b border-voidBorder">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2">
                        <div class="hex-decoration text-sm">✦</div>
                        <span class="text-sm font-semibold text-gradient">Campus Compass</span>
                    </div>
                    <button onclick="toggleSidebar()" class="text-stardust hover:text-starlight transition-colors" title="关闭菜单" aria-label="关闭菜单">
                        <i class="fa fa-times" aria-hidden="true"></i>
                    </button>
                </div>

                <button onclick="createNewChat()"
                    class="w-full py-2.5 bg-nebulaMuted border border-voidBorder text-nebula text-sm font-medium rounded-lg hover:bg-nebula/15 hover:border-nebula/30 hover:shadow-[0_0_15px_rgba(139,92,246,0.2)] transition-all flex items-center justify-center gap-2">
                    <i class="fa fa-plus"></i>
                    新建对话
                </button>
            </div>

            <div class="p-3 border-b border-voidBorder">
                <div class="relative">
                    <i class="fa fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-stardust text-xs"></i>
                    <input type="text" id="searchInput" placeholder="搜索历史对话..." aria-label="搜索历史对话"
                        class="w-full bg-voidInput border border-voidBorder rounded-lg pl-9 pr-3 py-2 text-xs text-starlight outline-none focus:border-nebula/40 focus:shadow-[0_0_10px_rgba(139,92,246,0.15)] transition-all placeholder:text-stardust"
                        oninput="searchChats()">
                </div>
            </div>

            <div class="flex-1 overflow-y-auto sidebar p-3" id="chatList">
            </div>
        </div>

        <!-- 侧边栏遮罩 -->
        <div id="sidebarOverlay" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-30" onclick="toggleSidebar()"></div>

        <div class="flex flex-col h-full flex-1" id="mainContent">

            <header class="flex items-center justify-between px-6 py-4 border-b border-voidBorder flex-shrink-0 glass-panel">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()"
                        class="w-8 h-8 bg-voidHover border border-voidBorder rounded-lg flex items-center justify-center hover:border-nebula/30 hover:shadow-[0_0_10px_rgba(139,92,246,0.2)] transition-all group"
                        title="菜单" aria-label="打开菜单">
                        <i class="fa fa-bars text-stardust text-sm group-hover:text-nebula transition-colors"></i>
                    </button>
                    <div class="flex items-center gap-2">
                        <div class="hex-decoration text-lg">✦</div>
                        <div>
                            <span class="text-base font-semibold tracking-tight text-gradient">Campus Compass</span>
                            <span class="text-xs text-stardust ml-2">校园活动策划助手</span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button id="themeToggleBtn" onclick="toggleThemePanel()"
                        class="relative w-8 h-8 bg-voidHover border border-voidBorder rounded-lg flex items-center justify-center hover:border-nebula/30 hover:shadow-[0_0_10px_rgba(139,92,246,0.2)] transition-all group"
                        title="主题设置" aria-label="主题设置">
                        <i id="themeIcon" class="fa fa-moon-o text-stardust text-sm group-hover:text-amber transition-colors"></i>
                    </button>
                    <button id="proxyToggleBtn" onclick="toggleProxyPanel()"
                        class="relative w-8 h-8 bg-voidHover border border-voidBorder rounded-lg flex items-center justify-center hover:border-nebula/30 hover:shadow-[0_0_10px_rgba(139,92,246,0.2)] transition-all group"
                        title="代理设置" aria-label="代理设置">
                        <i class="fa fa-cog text-stardust text-sm group-hover:text-nebula transition-colors"></i>
                        <span id="proxyStatusDot"
                            class="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full border border-void bg-greenOk shadow-[0_0_4px_rgba(74,222,128,0.5)]"></span>
                    </button>
                    <span class="text-xs text-amber bg-amberMuted px-3 py-1 rounded-full border border-goldBorder">✦ AI 驱动 · 实时流式</span>
                </div>
            </header>

            <div class="chat-area flex-1 overflow-y-auto px-6 py-4 flex flex-col gap-4" id="chatArea">
                <div class="welcome-card flex flex-col items-center justify-center flex-1 py-16" id="welcomeCard">
                    <!-- 装饰性星座线 -->
                    <!-- stylelint-disable-next-line no-inline-styles -->
                    <div class="relative mb-6">
                        <svg width="80" height="80" viewBox="0 0 80 80" class="opacity-60">
                            <circle cx="40" cy="15" r="2" fill="#f0c060" class="opacity-60" />
                            <circle cx="20" cy="45" r="1.5" fill="#8b5cf6" class="opacity-60" style="animation-delay: 0.5s" />
                            <circle cx="60" cy="45" r="1.5" fill="#22d3bb" class="opacity-60" style="animation-delay: 1s" />
                            <circle cx="25" cy="68" r="1.5" fill="#8b5cf6" class="opacity-60" style="animation-delay: 1.5s" />
                            <circle cx="55" cy="68" r="1.5" fill="#22d3bb" class="opacity-60" style="animation-delay: 2s" />
                            <line x1="40" y1="15" x2="20" y2="45" stroke="rgba(240,192,96,0.3)" stroke-width="0.5" />
                            <line x1="40" y1="15" x2="60" y2="45" stroke="rgba(240,192,96,0.3)" stroke-width="0.5" />
                            <line x1="20" y1="45" x2="25" y2="68" stroke="rgba(139,92,246,0.25)" stroke-width="0.5" />
                            <line x1="60" y1="45" x2="55" y2="68" stroke="rgba(139,92,246,0.25)" stroke-width="0.5" />
                            <line x1="25" y1="68" x2="55" y2="68" stroke="rgba(34,211,187,0.2)" stroke-width="0.5" />
                        </svg>
                    </div>
                    <div class="flex items-center gap-3 mb-6">
                        <div class="hex-decoration text-2xl">✦</div>
                        <h1 class="text-2xl font-semibold tracking-tight text-gradient">Campus Compass</h1>
                    </div>

                    <p class="text-stardust text-sm mb-6 text-center max-w-md leading-relaxed">
                        智能活动策划助手<br>
                        输入活动主题 → 确认参与人数 → 实时流式生成完整方案<br>
                        活动地点：<span class="text-amber font-semibold">E教学楼</span>
                    </p>

                    <div class="glass-panel rounded-2xl px-5 py-4 mb-8 max-w-md w-full text-left">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-lg">✦</span>
                            <span class="text-sm font-semibold text-starlight">请提供您需要策划的活动主题</span>
                        </div>
                        <p class="text-xs text-stardust leading-relaxed">
                            可以是简要关键词或详细描述，系统会自动判断是否需要扩展
                        </p>
                    </div>

                    <div class="grid grid-cols-4 gap-3 max-w-2xl w-full">
                        <button onclick="sendQuick('科技创新活动')"
                            class="flex flex-col items-center gap-2 p-4 glass-panel rounded-2xl hover:border-nebula/30 hover:shadow-[0_0_20px_rgba(139,92,246,0.15)] transition-all group">
                            <span class="text-2xl group-hover:scale-110 transition-transform">🚀</span>
                            <span class="text-sm font-medium text-starlight">科技创新</span>
                            <span class="text-xs text-stardust">自动扩展</span>
                        </button>
                        <button onclick="sendQuick('电脑硬件知识分享会')"
                            class="flex flex-col items-center gap-2 p-4 glass-panel rounded-2xl hover:border-amber/30 hover:shadow-[0_0_20px_rgba(240,192,96,0.12)] transition-all group">
                            <span class="text-2xl group-hover:scale-110 transition-transform">🎭</span>
                            <span class="text-sm font-medium text-starlight">硬件分享</span>
                            <span class="text-xs text-stardust">直接采用</span>
                        </button>
                        <button onclick="sendQuick('校园音乐节')"
                            class="flex flex-col items-center gap-2 p-4 glass-panel rounded-2xl hover:border-nebula/30 hover:shadow-[0_0_20px_rgba(139,92,246,0.15)] transition-all group">
                            <span class="text-2xl group-hover:scale-110 transition-transform">🎵</span>
                            <span class="text-sm font-medium text-starlight">校园音乐</span>
                            <span class="text-xs text-stardust">自动扩展</span>
                        </button>
                        <button onclick="sendQuick('大学生编程马拉松挑战赛')"
                            class="flex flex-col items-center gap-2 p-4 glass-panel rounded-2xl hover:border-cyan/30 hover:shadow-[0_0_20px_rgba(34,211,187,0.12)] transition-all group">
                            <span class="text-2xl group-hover:scale-110 transition-transform">🏆</span>
                            <span class="text-sm font-medium text-starlight">编程马拉松</span>
                            <span class="text-xs text-stardust">直接采用</span>
                        </button>
                        <button onclick="sendQuick('校园摄影展')"
                            class="flex flex-col items-center gap-2 p-4 glass-panel rounded-2xl hover:border-amber/30 hover:shadow-[0_0_20px_rgba(240,192,96,0.12)] transition-all group">
                            <span class="text-2xl group-hover:scale-110 transition-transform">📷</span>
                            <span class="text-sm font-medium text-starlight">摄影展</span>
                            <span class="text-xs text-stardust">30人</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex-shrink-0 px-6 pb-6">
                <div class="max-w-3xl mx-auto">
                    <!-- 温度调节滑条（可展开/收起） -->
                    <div id="tempRow" class="hidden mb-2 px-1 flex items-center gap-3 animate-slide-in">
                        <span class="text-xs text-stardust whitespace-nowrap">✦ 创意度</span>
                        <input type="range" id="tempSlider" min="0.3" max="1.2" step="0.1" value="0.8" aria-label="创意度"
                            class="flex-1 h-1.5 bg-voidHover rounded-full appearance-none cursor-pointer
                                   [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-3.5 [&::-webkit-slider-thumb]:h-3.5 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-nebula [&::-webkit-slider-thumb]:shadow-[0_0_6px_rgba(139,92,246,0.5)]"
                            oninput="updateTempLabel()">
                        <span class="text-xs text-nebula font-medium w-7 text-right" id="tempLabel">0.8</span>
                    </div>
                    <!-- 输入栏 -->
                    <div class="glass-panel rounded-3xl py-2.5 px-4 flex items-center gap-2 border border-white/5
                                focus-within:ring-2 focus-within:ring-white/25 focus-within:border-white/15
                                focus-within:shadow-[0_0_25px_rgba(255,255,255,0.12),0_0_8px_rgba(255,255,255,0.06)]
                                transition-all duration-300">
                        <textarea id="msgInput" placeholder="输入活动主题，每次围绕一个主题哦~" aria-label="输入活动主题"
                            class="flex-1 bg-transparent resize-none outline-none text-starlight placeholder:text-stardust text-sm h-[38px] max-h-24 leading-9"
                            rows="1" onkeydown="handleKeyDown(event)"></textarea>
                        <span class="text-stardust text-xs" id="wordCount">0</span>
                        <button id="tempToggleBtn" onclick="toggleTempRow()"
                            class="w-8 h-8 bg-voidHover border border-voidBorder rounded-full flex items-center justify-center hover:border-nebula/30 hover:shadow-[0_0_8px_rgba(139,92,246,0.15)] transition-all flex-shrink-0"
                            title="创意度" aria-label="创意度设置">
                            <span class="text-xs">🎲</span>
                        </button>
                        <button id="sendBtn"
                            class="w-9 h-9 bg-nebula/25 border border-nebula/40 rounded-full flex items-center justify-center hover:bg-nebula/35 hover:shadow-[0_0_15px_rgba(139,92,246,0.3)] transition-all disabled:opacity-30 flex-shrink-0"
                            onclick="sendMessage()" title="发送" aria-label="发送消息">
                            <i class="fa fa-arrow-up text-nebula text-sm" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- 代理配置面板 -->
    <div id="proxyPanel" class="hidden fixed top-16 right-6 z-50 animate-slide-in">
        <div class="glass-panel-strong rounded-2xl p-5 w-80 shadow-2xl shadow-black/40">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <span class="text-sm">⚙️</span>
                    <span class="text-sm font-semibold text-starlight">代理设置</span>
                </div>
                <button onclick="toggleProxyPanel()" class="text-stardust hover:text-starlight" title="关闭" aria-label="关闭代理设置">
                    <i class="fa fa-times" aria-hidden="true"></i>
                </button>
            </div>

            <div class="flex items-center justify-between mb-4">
                <span class="text-xs text-stardust">启用代理</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="proxyEnabled" class="sr-only peer" onchange="onProxyToggle()">
                    <div class="w-9 h-5 bg-voidHover rounded-full peer peer-checked:bg-nebula/50 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-starlight after:rounded-full after:h-4 after:w-4 after:transition-all">
                    </div>
                </label>
            </div>

            <div class="mb-3">
                <label class="text-xs text-stardust block mb-1.5">代理地址</label>
                <div class="flex gap-2">
                    <input type="text" id="proxyAddress" aria-label="代理地址"
                        class="flex-1 bg-voidInput border border-voidBorder rounded-lg px-3 py-2 text-xs text-starlight outline-none focus:border-nebula/40 focus:shadow-[0_0_8px_rgba(139,92,246,0.15)] transition-all placeholder:text-stardust"
                        placeholder="http://127.0.0.1:7897">
                    <button onclick="testProxy()"
                        class="px-3 py-2 bg-voidHover border border-voidBorder rounded-lg text-xs text-stardust hover:border-nebula/30 hover:text-nebula transition-all"
                        id="testProxyBtn">
                        <span id="testProxyText">测试</span>
                        <span id="testProxySpinner" class="hidden"><i class="fa fa-spinner fa-spin"></i></span>
                    </button>
                </div>
            </div>

            <div id="proxyMsg" class="text-xs mb-3 min-h-[20px] hidden"></div>

            <button onclick="saveProxy()"
                class="w-full py-2 bg-nebulaMuted border border-voidBorder text-nebula text-xs rounded-lg hover:bg-nebula/15 hover:shadow-[0_0_10px_rgba(139,92,246,0.15)] transition-all">
                保存配置
            </button>
        </div>
    </div>

    <div id="proxyOverlay" class="hidden fixed inset-0 z-40" onclick="toggleProxyPanel()"></div>

    <!-- 主题设置面板 -->
    <div id="themePanel" class="hidden fixed top-16 right-6 z-50 animate-slide-in">
        <div class="glass-panel-strong rounded-2xl p-5 w-80 shadow-2xl shadow-black/40">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <span class="text-sm">🎨</span>
                    <span class="text-sm font-semibold text-starlight">主题设置</span>
                </div>
                <button onclick="toggleThemePanel()" class="text-stardust hover:text-starlight" title="关闭" aria-label="关闭主题设置">
                    <i class="fa fa-times" aria-hidden="true"></i>
                </button>
            </div>

            <div class="mb-4">
                <span class="text-xs text-stardust block mb-2">显示模式</span>
                <div class="flex gap-2">
                    <button id="btnDayMode" onclick="setTheme('day')"
                        class="flex-1 py-2 px-3 rounded-lg text-xs font-medium transition-all border bg-voidHover border-voidBorder text-stardust hover:border-amber/30 hover:text-amber">
                        ☀️ 曙光
                    </button>
                    <button id="btnNightMode" onclick="setTheme('night')"
                        class="flex-1 py-2 px-3 rounded-lg text-xs font-medium transition-all border bg-nebulaMuted border-nebula/30 text-nebula">
                        🌙 星夜
                    </button>
                </div>
            </div>

            <div class="border-t border-voidBorder my-4"></div>

            <div class="mb-3">
                <span class="text-xs text-stardust block mb-2">自定义背景图片</span>
                <input type="file" id="bgImageInput" accept="image/*" class="hidden" onchange="handleBgImage(event)">
                <div class="flex gap-2">
                    <button onclick="document.getElementById('bgImageInput').click()"
                        class="flex-1 py-2 px-3 bg-voidHover border border-voidBorder rounded-lg text-xs text-stardust hover:border-nebula/30 transition-all text-center">
                        📁 选择本地图片
                    </button>
                    <button id="btnClearBg" onclick="clearBgImage()"
                        class="py-2 px-3 bg-voidHover border border-voidBorder rounded-lg text-xs text-stardust hover:border-redErr/30 hover:text-redErr transition-all hidden">
                        ✕ 清除
                    </button>
                </div>
                <p id="bgImageName" class="text-xs text-stardust mt-2 hidden"></p>
            </div>

            <div id="themeMsg" class="text-xs min-h-[20px] hidden"></div>
        </div>
    </div>

    <div id="themeOverlay" class="hidden fixed inset-0 z-40" onclick="toggleThemePanel()"></div>

    <script>
        // ═══════════════════════════════════════════════
        //  业务逻辑
        // ═══════════════════════════════════════════════
        const chatArea = document.getElementById("chatArea");
        const msgInput = document.getElementById("msgInput");
        const sendBtn = document.getElementById("sendBtn");
        const wordCount = document.getElementById("wordCount");
        let isLoading = false;
        let sessionId = "";
        let creativity = 0.8;

        // ===== 代理配置 =====
        let proxyEnabled = false;
        let proxyAddress = "";
        let proxyPanelOpen = false;

        function loadProxyConfig() {
            const saved = localStorage.getItem("campus_compass_proxy");
            if (saved) {
                try {
                    const cfg = JSON.parse(saved);
                    proxyEnabled = cfg.enabled !== undefined ? cfg.enabled : false;
                    proxyAddress = cfg.address || "";
                } catch (e) {}
            }
            document.getElementById("proxyEnabled").checked = proxyEnabled;
            document.getElementById("proxyAddress").value = proxyAddress;
            updateProxyStatusDot();
        }

        function saveProxyToStorage() {
            localStorage.setItem("campus_compass_proxy", JSON.stringify({
                enabled: proxyEnabled,
                address: proxyAddress,
            }));
        }

        function updateProxyStatusDot() {
            const dot = document.getElementById("proxyStatusDot");
            if (proxyEnabled) {
                dot.className =
                    "absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full border border-void bg-greenOk shadow-[0_0_4px_rgba(74,222,128,0.5)]";
            } else {
                dot.className =
                    "absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full border border-void bg-amberWarn shadow-[0_0_4px_rgba(251,191,36,0.5)]";
            }
        }

        function onProxyToggle() {
            proxyEnabled = document.getElementById("proxyEnabled").checked;
            updateProxyStatusDot();
            syncProxyToServer();
        }

        function syncProxyToServer() {
            if (!sessionId) return;
            fetch("/api/proxy", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    session_id: sessionId,
                    enabled: proxyEnabled,
                    address: proxyAddress,
                }),
            }).catch(() => {});
        }

        function toggleProxyPanel() {
            proxyPanelOpen = !proxyPanelOpen;
            document.getElementById("proxyPanel").classList.toggle("hidden", !proxyPanelOpen);
            document.getElementById("proxyOverlay").classList.toggle("hidden", !proxyPanelOpen);
            if (proxyPanelOpen) {
                if (themePanelOpen) toggleThemePanel();
                document.getElementById("proxyAddress").focus();
            }
        }

        function showProxyMsg(text, type) {
            const el = document.getElementById("proxyMsg");
            el.classList.remove("hidden");
            const colors = {
                success: "text-greenOk",
                error: "text-redErr",
                info: "text-stardust",
                warning: "text-amberWarn",
            };
            el.className = "text-xs mb-3 min-h-[20px] " + (colors[type] || "text-stardust");
            el.textContent = text;
        }

        async function testProxy() {
            const address = document.getElementById("proxyAddress").value.trim();
            if (!address) { showProxyMsg("请输入代理地址", "error"); return; }
            const testBtn = document.getElementById("testProxyBtn");
            const testText = document.getElementById("testProxyText");
            const testSpinner = document.getElementById("testProxySpinner");
            testBtn.disabled = true;
            testText.classList.add("hidden");
            testSpinner.classList.remove("hidden");
            showProxyMsg("正在测试连接...", "info");
            try {
                const r = await fetch("/api/proxy/test", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ address }),
                });
                const d = await r.json();
                showProxyMsg(d.success ? "✅ " + d.message : "❌ " + d.message, d.success ? "success" : "error");
            } catch (e) {
                showProxyMsg("❌ 网络请求失败", "error");
            } finally {
                testBtn.disabled = false;
                testText.classList.remove("hidden");
                testSpinner.classList.add("hidden");
            }
        }

        function saveProxy() {
            proxyAddress = document.getElementById("proxyAddress").value.trim();
            if (!proxyAddress) { showProxyMsg("请输入代理地址", "error"); return; }
            saveProxyToStorage();
            syncProxyToServer();
            showProxyMsg("✅ 配置已保存", "success");
            setTimeout(() => toggleProxyPanel(), 800);
        }
        document.getElementById("proxyAddress").addEventListener("keydown", function(e) {
            if (e.key === "Enter") saveProxy();
        });
        loadProxyConfig();

        // ===== 主题设置 =====
        let currentTheme = 'night';
        let customBgImage = null;
        let themePanelOpen = false;

        function loadTheme() {
            const saved = localStorage.getItem('campus_compass_theme');
            if (saved) {
                try {
                    const cfg = JSON.parse(saved);
                    currentTheme = cfg.theme || 'night';
                    customBgImage = cfg.bgImage || null;
                } catch (e) {}
            }
            applyTheme();
        }

        function saveTheme() {
            localStorage.setItem('campus_compass_theme', JSON.stringify({
                theme: currentTheme,
                bgImage: customBgImage,
            }));
        }

        function applyTheme() {
            const body = document.getElementById('appBody');
            const btnDay = document.getElementById('btnDayMode');
            const btnNight = document.getElementById('btnNightMode');
            const themeIcon = document.getElementById('themeIcon');
            const btnClear = document.getElementById('btnClearBg');
            const bgName = document.getElementById('bgImageName');

            if (currentTheme === 'day') {
                body.classList.add('day-mode');
                btnDay.className = 'flex-1 py-2 px-3 rounded-lg text-xs font-medium transition-all border bg-amberMuted border-amber/30 text-amber';
                btnNight.className = 'flex-1 py-2 px-3 rounded-lg text-xs font-medium transition-all border bg-voidHover border-voidBorder text-stardust hover:border-nebula/30';
                themeIcon.className = 'fa fa-sun-o text-amber text-sm';
            } else {
                body.classList.remove('day-mode');
                btnNight.className = 'flex-1 py-2 px-3 rounded-lg text-xs font-medium transition-all border bg-nebulaMuted border-nebula/30 text-nebula';
                btnDay.className = 'flex-1 py-2 px-3 rounded-lg text-xs font-medium transition-all border bg-voidHover border-voidBorder text-stardust hover:border-amber/30';
                themeIcon.className = 'fa fa-moon-o text-stardust text-sm';
            }
            if (customBgImage) {
                body.classList.add('custom-bg');
                body.style.setProperty('--bg-image', `url(${customBgImage})`);
                btnClear.classList.remove('hidden');
                bgName.classList.remove('hidden');
                bgName.textContent = '已设置自定义背景';
            } else {
                body.classList.remove('custom-bg');
                body.style.removeProperty('--bg-image');
                btnClear.classList.add('hidden');
                bgName.classList.add('hidden');
            }
        }

        function setTheme(mode) { currentTheme = mode;
            applyTheme();
            saveTheme(); }

        function toggleThemePanel() {
            themePanelOpen = !themePanelOpen;
            document.getElementById('themePanel').classList.toggle('hidden', !themePanelOpen);
            document.getElementById('themeOverlay').classList.toggle('hidden', !themePanelOpen);
            if (themePanelOpen && typeof proxyPanelOpen !== 'undefined' && proxyPanelOpen) toggleProxyPanel();
        }

        function handleBgImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) { showThemeMsg('请选择图片文件', 'error'); return; }
            const reader = new FileReader();
            reader.onload = function(e) {
                customBgImage = e.target.result;
                applyTheme();
                saveTheme();
                showThemeMsg('✅ 背景图片已应用（透明度 75%）', 'success');
            };
            reader.onerror = function() { showThemeMsg('图片读取失败，请重试', 'error'); };
            reader.readAsDataURL(file);
        }

        function clearBgImage() {
            customBgImage = null;
            applyTheme();
            saveTheme();
            document.getElementById('bgImageInput').value = '';
            showThemeMsg('已恢复默认星空背景', 'info');
        }

        function showThemeMsg(text, type) {
            const el = document.getElementById('themeMsg');
            el.classList.remove('hidden');
            const colors = { success: 'text-greenOk', error: 'text-redErr', info: 'text-stardust' };
            el.className = 'text-xs min-h-[20px] ' + (colors[type] || 'text-stardust');
            el.textContent = text;
            setTimeout(() => { el.classList.add('hidden'); }, 3000);
        }
        loadTheme();

        // ===== 聊天功能 =====
        msgInput.addEventListener("input", () => {
            msgInput.style.height = "auto";
            msgInput.style.height = Math.min(msgInput.scrollHeight, 128) + "px";
            wordCount.textContent = msgInput.value.length;
        });

        function toggleTempRow() { document.getElementById("tempRow").classList.toggle("hidden"); }

        function updateTempLabel() {
            creativity = parseFloat(document.getElementById("tempSlider").value);
            document.getElementById("tempLabel").textContent = creativity.toFixed(1);
        }

        function handleKeyDown(e) {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault();
                sendMessage(); }
        }

        function sendQuick(text) { msgInput.value = text;
            sessionId = "";
            sendMessage(); }

        function generatePlanNow() { msgInput.value = "生成完整方案";
            sendMessage(); }

        // ===== 侧边栏 =====
        let sidebarOpen = false;
        let chats = [];
        let currentChatId = null;
        let messageCount = 0;

        // ── 页面加载时恢复历史对话（防止被空白 chats 覆盖）──
        loadChatList();

        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebarOpen) {
                sidebar.classList.remove('hidden');
                overlay.classList.remove('hidden');
                loadChatList();
            } else {
                sidebar.classList.add('hidden');
                overlay.classList.add('hidden');
            }
        }

        function loadChatList() {
            try {
                const savedChats = localStorage.getItem('campusCompassChats');
                chats = savedChats ? (Array.isArray(JSON.parse(savedChats)) ? JSON.parse(savedChats) : []) : [];
            } catch (e) { chats = []; }
            renderChatList(chats);
        }

        function renderChatList(chatList) {
            const chatListEl = document.getElementById('chatList');
            chatListEl.innerHTML = '';
            if (chatList.length === 0) {
                chatListEl.innerHTML = `
                    <div class="text-center text-stardust text-xs py-8">
                        <span class="text-2xl mb-2 block">✦</span>
                        暂无历史对话
                    </div>`;
                return;
            }
            const sortedChats = [...chatList].sort((a, b) => {
                try { return new Date(b.updatedAt) - new Date(a.updatedAt); } catch { return 0; }
            });
            sortedChats.forEach(chat => {
                const chatDiv = document.createElement('div');
                chatDiv.className =
                    `mb-2 p-3 rounded-xl border border-voidBorder hover:border-nebula/30 hover:shadow-[0_0_8px_rgba(139,92,246,0.1)] cursor-pointer transition-all ${currentChatId === chat.id ? 'bg-nebulaMuted border-nebula/30' : ''}`;
                chatDiv.onclick = () => loadChat(chat.id);
                const title = chat.title || '新对话';
                const preview = chat.preview || '';
                let dateStr = '';
                try { dateStr = formatDate(chat.updatedAt); } catch { dateStr = ''; }
                chatDiv.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-sm font-medium text-starlight truncate flex-1 mr-2">${escapeHtml(title)}</span>
                        <button class="delete-btn text-stardust hover:text-red-400 transition-colors" title="删除对话" aria-label="删除对话">
                            <i class="fa fa-trash-o text-xs" aria-hidden="true"></i>
                        </button>
                    </div>
                    <p class="text-xs text-stardust truncate">${escapeHtml(preview)}</p>
                    <p class="text-xs text-stardust/60 mt-1">${escapeHtml(dateStr)}</p>`;
                chatDiv.querySelector('.delete-btn').onclick = (e) => { e.stopPropagation();
                    deleteChat(chat.id); };
                chatListEl.appendChild(chatDiv);
            });
        }

        function createNewChat() {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: '新对话',
                preview: '',
                messages: [],
                sessionId: null,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
            chats.unshift(newChat);
            saveChats();
            loadChatIntoInterface(newChat);
            toggleSidebar();
        }

        function loadChat(chatId) {
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;
            loadChatIntoInterface(chat);
            toggleSidebar();
        }

        function loadChatIntoInterface(chat) {
            currentChatId = chat.id;
            sessionId = chat.sessionId || '';
            messageCount = chat.messages.length;
            const welcomeCard = document.getElementById('welcomeCard');
            if (welcomeCard) welcomeCard.remove();
            chatArea.innerHTML = '';
            if (chat.messages.length > 0) {
                chat.messages.forEach(msg => {
                    if (msg.isUser) addUserMsgDirect(msg.text);
                    else addAiMsgDirect(msg.html);
                });
            } else {
                chatArea.innerHTML = `
                    <div class="welcome-card flex flex-col items-center justify-center flex-1 py-16" id="welcomeCard">
                        <div class="relative mb-6">
                            <svg width="80" height="80" viewBox="0 0 80 80" class="opacity-60">
                                <circle cx="40" cy="15" r="2" fill="#f0c060" class="opacity-60" />
                                <circle cx="20" cy="45" r="1.5" fill="#8b5cf6" class="opacity-60" style="animation-delay: 0.5s" />
                                <circle cx="60" cy="45" r="1.5" fill="#22d3bb" class="opacity-60" style="animation-delay: 1s" />
                                <circle cx="25" cy="68" r="1.5" fill="#8b5cf6" class="opacity-60" style="animation-delay: 1.5s" />
                                <circle cx="55" cy="68" r="1.5" fill="#22d3bb" class="opacity-60" style="animation-delay: 2s" />
                                <line x1="40" y1="15" x2="20" y2="45" stroke="rgba(240,192,96,0.3)" stroke-width="0.5" />
                                <line x1="40" y1="15" x2="60" y2="45" stroke="rgba(240,192,96,0.3)" stroke-width="0.5" />
                                <line x1="20" y1="45" x2="25" y2="68" stroke="rgba(139,92,246,0.25)" stroke-width="0.5" />
                                <line x1="60" y1="45" x2="55" y2="68" stroke="rgba(139,92,246,0.25)" stroke-width="0.5" />
                                <line x1="25" y1="68" x2="55" y2="68" stroke="rgba(34,211,187,0.2)" stroke-width="0.5" />
                            </svg>
                        </div>
                        <div class="flex items-center gap-3 mb-6">
                            <div class="hex-decoration text-2xl">✦</div>
                            <h1 class="text-2xl font-semibold tracking-tight text-gradient">Campus Compass</h1>
                        </div>
                        <p class="text-stardust text-sm mb-6 text-center max-w-md">智能活动策划助手</p>
                    </div>`;
            }
            scrollToBottom();
            renderChatList(chats);
        }

        function saveMessageToChat(isUser, text, html) {
            if (!currentChatId) {
                const newChat = {
                    id: 'chat_' + Date.now(),
                    title: text.substring(0, 30) || '新对话',
                    preview: text.substring(0, 50),
                    messages: [],
                    sessionId: null,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };
                chats.unshift(newChat);
                currentChatId = newChat.id;
            }
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;
            chat.messages.push({ isUser, text, html, timestamp: new Date().toISOString() });
            if (isUser && chat.title === '新对话') chat.title = text.substring(0, 30);
            if (!isUser && text) chat.preview = text.substring(0, 50);
            chat.updatedAt = new Date().toISOString();
            if (sessionId) chat.sessionId = sessionId;
            messageCount++;
            saveChats();
        }

        function addUserMsgDirect(text) {
            const div = document.createElement("div");
            div.className = "flex justify-end";
            div.innerHTML = `<div class="max-w-[70%] bg-nebulaMuted border border-nebula/25 text-starlight px-5 py-3 rounded-2xl rounded-br-md text-sm leading-relaxed shadow-[0_0_10px_rgba(139,92,246,0.08)]">${escapeHtml(text)}</div>`;
            chatArea.appendChild(div);
        }

        function addAiMsgDirect(html) {
            const div = document.createElement("div");
            div.className = "flex justify-start";
            div.innerHTML = `<div class="max-w-[85%]">${html}</div>`;
            chatArea.appendChild(div);
        }

        function saveChats() { localStorage.setItem('campusCompassChats', JSON.stringify(chats)); }

        function deleteChat(chatId) {
            if (!confirm('确定要删除这个对话吗？')) return;
            chats = chats.filter(c => c.id !== chatId);
            saveChats();
            if (currentChatId === chatId) {
                currentChatId = null;
                sessionId = '';
                chatArea.innerHTML = `
                    <div class="welcome-card flex flex-col items-center justify-center flex-1 py-16" id="welcomeCard">
                        <div class="relative mb-6">
                            <svg width="80" height="80" viewBox="0 0 80 80" class="opacity-60">
                                <circle cx="40" cy="15" r="2" fill="#f0c060" class="opacity-60" />
                                <circle cx="20" cy="45" r="1.5" fill="#8b5cf6" class="opacity-60" style="animation-delay: 0.5s" />
                                <circle cx="60" cy="45" r="1.5" fill="#22d3bb" class="opacity-60" style="animation-delay: 1s" />
                                <line x1="40" y1="15" x2="20" y2="45" stroke="rgba(240,192,96,0.3)" stroke-width="0.5" />
                                <line x1="40" y1="15" x2="60" y2="45" stroke="rgba(240,192,96,0.3)" stroke-width="0.5" />
                            </svg>
                        </div>
                        <div class="flex items-center gap-3 mb-6">
                            <div class="hex-decoration text-2xl">✦</div>
                            <h1 class="text-2xl font-semibold tracking-tight text-gradient">Campus Compass</h1>
                        </div>
                    </div>`;
            }
            renderChatList(chats);
        }

        function searchChats() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (!query) { renderChatList(chats); return; }
            const filtered = chats.filter(chat =>
                chat.title.toLowerCase().includes(query) ||
                (chat.preview && chat.preview.toLowerCase().includes(query))
            );
            renderChatList(filtered);
        }

        function formatDate(dateStr) {
            try {
                if (!dateStr) return '';
                const date = new Date(dateStr);
                if (isNaN(date.getTime())) return '';
                const now = new Date();
                const diff = now - date;
                if (diff < 0) return '';
                if (diff < 60000) return '刚刚';
                if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
                if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
                if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
                return date.toLocaleDateString('zh-CN');
            } catch (e) { return ''; }
        }

        // ===== 消息发送 & 流式接收 =====
        function sendMessage() {
            const msg = msgInput.value.trim();
            if (!msg || isLoading) return;
            isLoading = true;
            sendBtn.disabled = true;
            msgInput.value = "";
            msgInput.style.height = "auto";
            wordCount.textContent = "0";
            const welcome = document.getElementById("welcomeCard");
            if (welcome) welcome.remove();
            addUserMsg(msg);
            saveMessageToChat(true, msg, '');
            addLoadingMsg();
            fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: msg, session_id: sessionId, temperature: creativity }),
                })
                .then(r => r.json())
                .then(d => {
                    removeLoadingMsg();
                    if (d.session_id) { sessionId = d.session_id;
                        syncProxyToServer(); }
                    if (d.stream) startStreaming();
                    else if (d.stream_done) { isLoading = false;
                        sendBtn.disabled = false;
                        msgInput.focus(); } else if (d.reply) {
                        addAiMsg(d.reply);
                        saveMessageToChat(false, '', d.reply);
                        isLoading = false;
                        sendBtn.disabled = false;
                        msgInput.focus();
                    }
                })
                .catch(() => {
                    removeLoadingMsg();
                    const errorHtml = '<div class="glass-panel border border-redErr/20 text-redErr px-5 py-3 rounded-2xl text-sm">网络请求失败，请确认服务已启动</div>';
                    addAiMsg(errorHtml);
                    saveMessageToChat(false, '网络请求失败', errorHtml);
                    isLoading = false;
                    sendBtn.disabled = false;
                });
        }

        function startStreaming() {
            const streamContainer = createStreamContainer();
            const textArea = streamContainer.querySelector("#streamText");
            const statusBadge = streamContainer.querySelector("#streamStatus");
            let streamCompleted = false;
            let finalHtml = '';
            let fullText = '';
            const eventSource = new EventSource(`/chat/stream?session_id=${sessionId}`);
            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === "chunk") {
                        fullText += data.text;
                        textArea.textContent += data.text;
                        scrollToBottom();
                    } else if (data.type === "done") {
                        streamCompleted = true;
                        eventSource.close();
                        finalHtml = data.html;
                        statusBadge.innerHTML =
                            '<span class="text-xs">✦</span><span class="text-greenOk text-xs">生成完成</span>';
                        setTimeout(() => {
                            streamContainer.outerHTML =
                                `<div class="max-w-[85%]">${finalHtml}
                                    <div class="flex items-center gap-3 mt-3 ml-1">
                                        <p class="text-xs text-stardust">✦ 请告诉我你的改进需求</p>
                                        <a href="/export/word?session_id=${sessionId}"
                                           class="btn-cosmos flex items-center gap-1.5 no-underline"
                                           title="导出为Word文档">
                                            <i class="fa fa-download text-xs"></i>
                                            <span class="text-xs">一键导出完整方案</span>
                                        </a>
                                    </div>
                                </div>`;
                            saveMessageToChat(false, fullText, finalHtml);
                            scrollToBottom();
                            finishStreaming();
                        }, 600);
                    } else if (data.type === "error") {
                        streamCompleted = true;
                        eventSource.close();
                        const errorText = `生成出错: ${data.message}`;
                        textArea.innerHTML += `\n\n<span class="text-redErr">${errorText}</span>`;
                        statusBadge.innerHTML =
                            '<span class="text-redErr text-xs">生成失败</span>';
                        const errorHtml =
                            `<div class="glass-panel border border-redErr/20 text-redErr px-5 py-3 rounded-2xl text-sm">${errorText}</div>`;
                        saveMessageToChat(false, errorText, errorHtml);
                        finishStreaming();
                    }
                } catch (e) { console.error("SSE parse error:", e); }
            };
            eventSource.onerror = function() {
                eventSource.close();
                if (streamCompleted) return;
                const errorText = '连接中断';
                statusBadge.innerHTML =
                    '<span class="text-redErr text-xs">连接中断</span>';
                const errorHtml =
                    `<div class="glass-panel border border-redErr/20 text-redErr px-5 py-3 rounded-2xl text-sm">${errorText}</div>`;
                saveMessageToChat(false, errorText, errorHtml);
                finishStreaming();
            };
        }

        function finishStreaming() {
            fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: "_stream_done_", session_id: sessionId }),
            }).finally(() => {
                isLoading = false;
                sendBtn.disabled = false;
                msgInput.focus();
            });
        }

        function createStreamContainer() {
            const div = document.createElement("div");
            div.className = "flex justify-start";
            div.innerHTML = `
                <div class="max-w-[85%] w-full">
                    <div class="glass-panel rounded-2xl overflow-hidden border-glow">
                        <div class="flex items-center justify-between px-5 py-3 border-b border-voidBorder bg-nebulaMuted/30">
                            <div class="flex items-center gap-2">
                                <span class="text-lg">✦</span>
                                <span class="text-sm font-semibold text-starlight">AI 正在生成活动方案</span>
                            </div>
                            <div id="streamStatus" class="flex items-center gap-1.5">
                                <span class="flex w-2 h-2 rounded-full bg-nebula animate-pulse-slow shadow-[0_0_6px_rgba(139,92,246,0.6)]"></span>
                                <span class="text-nebula text-xs">实时生成中</span>
                            </div>
                        </div>
                        <div class="px-5 py-4">
                            <pre id="streamText" class="stream-text text-sm text-starlight font-mono leading-relaxed max-h-96 overflow-y-auto"></pre>
                            <span class="inline-block w-1.5 h-4 bg-nebula ml-0.5 animate-typewriter align-middle shadow-[0_0_4px_rgba(139,92,246,0.5)]" id="streamCursor"></span>
                        </div>
                    </div>
                </div>`;
            chatArea.appendChild(div);
            scrollToBottom();
            return div;
        }

        function addUserMsg(text) {
            const div = document.createElement("div");
            div.className = "flex justify-end";
            div.innerHTML = `<div class="max-w-[70%] bg-nebulaMuted border border-nebula/25 text-starlight px-5 py-3 rounded-2xl rounded-br-md text-sm leading-relaxed shadow-[0_0_10px_rgba(139,92,246,0.08)]">${escapeHtml(text)}</div>`;
            chatArea.appendChild(div);
            scrollToBottom();
        }

        function addLoadingMsg() {
            const div = document.createElement("div");
            div.className = "flex justify-start";
            div.id = "loadingMsg";
            div.innerHTML = `<div class="flex gap-2 px-4 py-2">
                <span class="w-2 h-2 rounded-full bg-nebula/50 animate-bounce"></span>
                <span class="w-2 h-2 rounded-full bg-amber/50 animate-bounce" style="animation-delay:0.1s"></span>
                <span class="w-2 h-2 rounded-full bg-cyan/50 animate-bounce" style="animation-delay:0.2s"></span>
            </div>`;
            chatArea.appendChild(div);
            scrollToBottom();
        }

        function removeLoadingMsg() { const el = document.getElementById("loadingMsg"); if (el) el.remove(); }

        function addAiMsg(html) {
            const div = document.createElement("div");
            div.className = "flex justify-start";
            div.innerHTML = `<div class="max-w-[85%]">${html}</div>`;
            chatArea.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() { chatArea.scrollTop = chatArea.scrollHeight; }

        function escapeHtml(text) {
            const d = document.createElement("div");
            d.textContent = text;
            return d.innerHTML;
        }
    </script>
</body>

</html>
